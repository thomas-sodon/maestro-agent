[project]
name = "maestro-review"
version = "0.1.0"
description = "Standalone AI code review agent for GitHub pull requests"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.149",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-timeout>=2.3.0",
    "httpx",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
maestro-review = "maestro_review.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = [".."]
include = ["maestro_review*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",   # line length handled by formatter
    "SIM108", # ternary operator suggestions
]

[tool.ruff.lint.isort]
known-first-party = ["maestro_review"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
addopts = "--durations=10"
timeout = 5
timeout_method = "thread"
