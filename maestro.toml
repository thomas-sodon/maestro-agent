investigation_rate_window = 10          # Window of recent tasks measured (>= 1)
investigation_rate_threshold = 0.4      # Investigation fraction above which the directive fires [0.0-1.0]
investigation_rate_enabled = true       # Master switch

# Branchless-streak directive — when the last N consecutive tasks all produced
