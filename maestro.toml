uncalled_symbol_gate_enabled = true     # Master switch
uncalled_symbol_max_allowed = 0         # Max uncalled new defs before gate blocks (>= 0)

# Acceptance-criteria alignment — show the plan's acceptance_criteria block to
# the code-writing phases (implement + auto-fix), not just at self-review/PR.
criteria_alignment_enabled = true

# Quiet-skip gate — pre-call blocking gate that skips the generate_task LLM
# call when the task queue already holds items and no external requests
# (user or PR) are pending. Creates drain-then-refill cycles: the queue
# empties via _run_task_phase, then generate_task runs with fresher context.
quiet_skip_enabled = true               # Master switch

# Compound-scope gate — rejects self-generated tasks combining creation
# verbs (build/add/create) with connection verbs (wire/hook/integrate)
# via a conjunction marker. Addresses compound self-scoping that leads
# to partial completion. Deterministic regex — zero SDK cost.
compound_scope_gate_enabled = true      # Master switch

# Investigation-observable gate — steers a self-generated task that is
# investigation-framed (reading/tracing/understanding an existing mechanism)
# and commits to creating a new artifact file, while naming no observable
# instrument signal to read, toward reading and reporting a named signal
# (.jsonl ledger, diff-stat, gate-activation count, cost-gate value) instead.
# Post-call directive gate; empty-slot only. Deterministic regex — zero SDK cost.
investigation_observable_gate_enabled = true   # Master switch

# Plan-premise grounding — when on, propose_plan asks for a grounding probe and
# submit_for_review confirms it against a fresh reading of the tree as its first
# guard, recording a refuted-premise plan obsolete before a human approval is
# spent (proposal 114). Off = byte-identical to today.
plan_grounding_enabled = false          # [production: true — canary, proposal 114] Master switch

# Generator reality grounding — when on, propose_plan declares the measured
# problem a plan addresses and the names it newly defines, and submit_for_review
# clears both against the reality inventory as its first guard, recording a plan
# that re-proposes a shipped capability or cites an unmeasured problem obsolete
# before any human is notified (proposal 136). Off = byte-identical to today.
# Canaried only where the planner can read the measured-problem ids it must
# cite — through 143's read_reality_inventory tool (grounded planning canary).
generator_reality_grounding_enabled = false   # [production: true — canary, proposal 136] Master switch

# Phantom-premise gate — post-call content gate that refuses a self-generated
# goal claiming an existing defect in a .py path absent from the tree, while
# admitting a goal whose framing is to create that path. Deterministic regex
# over the existing missing-reference reading — zero SDK cost. Off = today.
phantom_premise_gate_enabled = false    # Master switch

[audit]
# Stall actuator — when an [audit]-prefixed open question survives this
# many CONSECUTIVE audit_self_model cycles without being INTEGRATEd by
# the LLM, generate_task() short-circuits to (None, None) (zero SDK
# cost) until the entry is removed. Threshold is in *audit cycles*, not
# loop iterations: at default loop.audit_self_every=10 a threshold of 5
# is ~50 iterations of grace. Opt-in: stall_block_enabled=false keeps
# the actuator dormant for lived-data observation before flipping on.
stall_threshold = 5            # Consecutive audit cycles before the gate engages (>= 1)
stall_block_enabled = false    # Master switch: false leaves the soft warning behavior intact

# Stale-self-model-entry rule (rule 6) — when true, the audit phase
# cross-checks identity_statements / capabilities_known / values against
# a rolling textual-evidence corpus (recent journal contents, task
# goals + key_findings, prior audit findings, resolution findings) and
# emits an [audit] stale_entry: <field>: <text> open question for any
# entry whose content tokens never appear in a single corpus item.
# Self-extinguishes when the LLM removes the entry. Default-on so
# stale entries are surfaced automatically in every audit cycle.
stale_entry_enabled = true     # Rule 6 master switch (zero SDK cost, no schema change)

# Post-merge impact-review rule (rule 9) — closes the verify→remove half
# of the full circuit. Scans the last impact_review_window VersionRecord
# entries and surfaces an [audit] unreviewed_evolution finding for any
# merged evolution older than impact_review_after_days that no recent task
# has revisited (by commit-SHA reference), routing it through the
# audit→directive bridge so its acceptance criteria get re-validated or the
# evolution retired. A surfaced-set sidecar (impact_review_surfaced.json)
# dedups so a version is raised once. Default-on; zero SDK cost.
impact_review_enabled = true     # Rule 9 master switch
impact_review_after_days = 7     # Age (days) before a merged version is review-due
impact_review_window = 10        # Trailing VersionRecord entries scanned per cycle

settlement_reconciler_enabled = true   # Proposal 097 master switch: on — each audit cycle _audit_self_model runs the standing reconciler binding recorded remediation verdicts to the is_pr_settled chokepoint via settled_verdicts.jsonl and threads the settled set into the two phantom rules as their settled_prs pre-filter, so a settled PR is skipped before each rule's merge predicate and every phantom finding self-extinguishes after settlement
settlement_record_reconciler_enabled = true   # Proposal 103 master switch for the on-settlement record-reconciler owner: on — the registered per-store record reconcilers run over settled PRs at the merge transition and each audit cycle, cleared behind the settlement_record structural guard (the registry is the sole on-settlement store-clear door)

# Orphaned-cure rule (rule 11) — the inward-turned tripwire. Flags an own
# "implemented"-but-unmerged evolution plan that has sat unmerged for at least
# orphaned_cure_age_cycles audit cycles while remediation-shaped tasks keep
# being lapped in the same window — a built cure orphaned at the merge tail
# while the laps it would eliminate continue. Age is measured in cycles via a
# first-seen sidecar, so a freshly-implemented plan is never flagged instantly.
# Detection-only; self-extinguishes once the cure merges. Default-on; zero SDK
# cost (one sidecar read/write under a file lock).
orphaned_cure_enabled = true     # Rule 11 master switch
orphaned_cure_age_cycles = 3     # Audit cycles unmerged before a cure is flagged

# Orphaned-cure retire actuator — rule 11's mechanical dispose complement.
# Retires (marks obsolete, capturing the fire to lever_attempts.jsonl) an
# implemented-but-unmerged plan whose sidecar age reaches the retire ceiling
# AND whose PR tend has directly observed as CONFLICTING
# (last_conflict_resolution_attempt_at set) — live conflict evidence, not a
# stamp. The ceiling must be strictly greater than orphaned_cure_age_cycles
# (10x the flag default) so only truly-dead cures qualify; the PR itself
# stays open for human disposition. Accepted gap: a retired cure leaves
# check_merged_plans' implemented-only view, so a later human merge of its
# PR is not auto-recorded (no merged status, no VersionRecord).
# Default-on; zero SDK cost.
orphaned_cure_retire_enabled = true    # Retire actuator switch
orphaned_cure_retire_age_cycles = 30   # Audit cycles before a conflicted cure is retired

# Phantom-escalation rule (rule 12) — the standing alarm at the door. Flags
# "partial" remediation laps whose result_summary asserts "escalating" for a
# "#NNNN" PR while no outbound message to Thomas references it — escalation that
# lived only in prose. Self-extinguishes the moment a referencing message is
# delivered. Default-on; zero SDK cost (pure cross-reference of recent tasks
# against recent messages).
phantom_escalation_enabled = true     # Rule 12 master switch
phantom_escalation_delivery_enabled = false  # [production: true — canary, proposal 090] Rule 12 delivery arm (proposal 090): mechanically send the merge-or-close message a phantom escalation only narrated

# Unconfirmed-own-landing rule (rule 14) — the standing alarm at my own commit.
# Rule 12 contests a verdict keyed by PR number; this one watches the most
# concrete handoff gap: a fix I committed on a DIRTY PR branch (a specific SHA),
# stamped "resolved on branch, awaiting tend push", and never confirmed reached
# main. Flags a "partial" task whose result_summary carries an on-branch handoff
# marker + a committed SHA + a "#NNNN" when git-merge-truth shows that SHA is
# still not an ancestor of origin/main (and the PR has not otherwise merged) past
# unconfirmed_landing_age_cycles audit cycles — handed is not landed. Age is
# measured in cycles via a first-seen sidecar so Tend's push latency is never
# mistaken for a gap; self-extinguishes the moment the SHA lands. Adds no push
# capability — the only act it forces is looking. Default-on; zero SDK cost (one
# sidecar read/write plus bounded git subprocesses per SHA/PR).
unconfirmed_landing_enabled = true      # Rule 14 master switch
unconfirmed_landing_age_cycles = 3      # Audit cycles unlanded before a SHA is flagged
unconfirmed_landing_forced_enabled = false  # [production: true — canary, proposal 090] Rule 14 forced disposition (proposal 090): route a past-grace PR-bearing finding through deliver_handoff (one merge-or-close message + durable standdown), not just journal

# Ungrounded-question-closure (rule 16, proposal 088 Phase 1) — the eyes veto a
# closure. Re-surfaces every removed open question whose only probe did not
# succeed (QuestionResolution disposition=removed + outcome != success) as a
# contradicted_claim [audit] finding, so the LLM must re-open it or justify the
# closure. Self-extinguishing once the row ages out or a successful probe
# re-resolves it. Default-off for opt-in lived-data validation; zero SDK cost.
ungrounded_closure_enabled = false          # Rule 16 master switch

# Reality-refutation (proposal 088 Phase 2) — the eyes win a sustained dispute.
# A git-grounded audit finding (phantom resolution, unconfirmed-own-
# landing) the LLM refutes every cycle while git still contradicts it currently
# re-fires with no escalating consequence. display_enabled injects a
# REALITY-REFUTATION contemplation line; reality_refutation_enabled (below) is
# the actuator that, at the same threshold, delivers one durable merge-or-close
# standdown via the escalation bridge. Both default-off; zero SDK cost.
reality_refutation_display_enabled = false  # [production: true — canary, proposal 090] Phase 2 display mirror
reality_refutation_threshold = 3            # Consecutive cycles before a refuted finding surfaces (>= 1)
reality_refutation_enabled = false          # [production: true — canary, proposal 090] Phase 2 actuator master switch

# Measurement-costume display (proposal 112) — when true, contemplate() injects a
# MEASUREMENT-COSTUME line naming the recent tasks framed as read-only
# investigation but discharged as tracked construction (the frame↔discharge owner
# stamped COSTUME). Self-extinguishing; zero SDK cost. Independent of the
# record-time cap's [loop] frame_discharge_bind_enabled.
costume_display_enabled = false

# Undefined-coinage display (proposal 101) — when true, contemplate() injects an
# UNDEFINED-COINAGE line naming coinages the journal actively mints that
# docs/lexicon.md does not yet define. Self-extinguishing; zero SDK cost.
undefined_coinage_display_enabled = false

# Flag-horizon display (proposal 117) — when true, contemplate() injects a
# FLAG-HORIZON line naming each EXPERIMENTAL_FLAGS entry within (or past) its
# review_by horizon, marking already-past ones OVERDUE, so an approaching
# promote-or-delete deadline reaches the agent on its own cadence rather than
# only as a late CI red. Self-extinguishing; zero SDK cost.
flag_horizon_display_enabled = false

# Split-due sensor (proposal 147) — when true, contemplate() injects a SPLIT-DUE
# line naming the worst source files at or above the split-due size line, so a
# growing module is named before it reaches the size wall. Self-extinguishing;
# zero SDK cost.
split_due_sensor_enabled = false

# Split-due directive bridge (proposal 147) — when true, audit_self_model fills an
# empty next_task_directive with a concern-split directive for the worst source
# file at or above the split-due line. Self-extinguishing; zero SDK cost.
split_due_directive_enabled = false

# Undefined-coinage directive bridge (proposal 101) — the actuator half of the
# display flag above. When true, _audit_self_model routes the top undefined
# coinage into an empty next_task_directive so the next task defines it (or lets
# it lapse). Defers to owned WIP; self-extinguishing; zero SDK cost.
undefined_coinage_directive_enabled = false

# Construction-dominance (rule 17) — surfaces the task-shape choice that precedes
# false-landing claims. When construction-shaped tasks reach the threshold fraction
# of the last window tasks, emits one finding naming the over-selection of a shape
# whose verdict Maestro signs itself (never an external "no"). Self-extinguishing
# below the threshold. Default-off for opt-in lived-data validation; zero SDK cost.
construction_dominance_enabled = false      # Rule 17 master switch
construction_dominance_threshold = 0.6      # Construction fraction that fires the rule ([0.0, 1.0])
construction_dominance_window = 10          # Recent tasks the fraction is computed over (>= 1)

# Phantom-partial-prune (rule 19) — the affirmative counterpart to the landing
# binds, aimed at the under-claim side of grounding-drift. When a partial-stamped
# self-directed, pr_head_sha-less task fired mark_plan_obsolete on a 12-hex
# plan_id whose disk status reads obsolete (fresh evolution_plans.jsonl load,
# not the gross pending_review count-delta concurrent writes corrupt), emits one
# finding: the prune landed, the verdict under-claimed it. Self-extinguishing.
# Default-off for opt-in lived-data validation; zero SDK cost.
phantom_partial_prune_enabled = false       # Rule 19 master switch

# Under-credited-landing (rule 20) — the affirmative twin of rule 14. Flags a
# non-success task whose own-committed SHA (extract_self_committed_shas) git
# proves is an ancestor of origin/main — a landing authored and stamped nothing.
# Closes the sensor asymmetry (every other landing rule only downgrades a claim,
# none rewards a confirmed one) that trains the disposal treadmill. Not an
# auto-relabel — surfaces one self-extinguishing [audit] finding for the LLM to
# judge. Default-off for opt-in lived-data validation; zero SDK cost (one bounded
# git subprocess per distinct cited SHA).
undercredited_landing_enabled = false       # [production: true — canary] Rule 20 master switch

# Reconcile-near-miss (rule 21) — the pre-landing complement of rule 20. Flags a
# partial remediation on a git-unlanded own PR measured <= reconcile_near_max_behind
# behind origin/main whose lineage authored no ancestor-of-main reconcile SHA — the
# actuator gap in the <=N-behind band that keeps "awaiting review/merge" structurally
# available for exactly the case that is mine to land (a cleanly-reconcilable own PR
# a few commits behind main). Only a new SHA on origin/main extinguishes it; it routes
# one self-extinguishing [audit] finding into a "Reconcile+push #N or gh pr close #N"
# directive. Default-off for opt-in lived-data validation; zero SDK cost (one bounded
# merge-truth read + one commits-behind measurement per distinct cited PR).
reconcile_near_miss_enabled = false         # [production: true — canary] Rule 21 master switch
reconcile_near_max_behind = 10              # Near-band ceiling in commits behind origin/main (>= 1)

# Green-ready-handoff (rule 22) — the earliest, most-owned handoff trigger. Every
# prior handoff arm fires late (the escalation bridge after lap-budget exhaustion;
# rule 14 on a verdict/SHA contradiction). This fires the instant
# an owned, git-unlanded PR reads merge-ready — every CI check SUCCESS, no
# code-clearable merge blocker, waiting only on Thomas's merge — and carries no
# pr_number-keyed handoff standdown: it routes that PR through the existing
# deliver_handoff actuator exactly once (one merge-or-close message + the durable
# standdown). The standdown self-extinguishes the rule and auto-releases on
# merge/close via the same forced-arm path rule 14 uses — no new capability, no
# new push. Default-on (the veto-proof handoff lever has fired zero times by
# intention, so a default-off flag would bind nothing); zero SDK cost.
green_ready_handoff_enabled = true          # Rule 22 master switch

# Banked-owned-act-reperformance — the retrospective artifact-id-axis complement to
# the prospective check_untouched_first_target task gate. Reads the three owned-act
# ledgers (stand-down verdicts, obsolete-prune plans, delivered handoffs) and flags a
# next_task_directive or queued goal that re-performs an already-banked act (re-doing
# it only re-banks a duplicate). Self-extinguishing; git-free, zero SDK cost.
# Default-off for opt-in lived-data validation.
banked_owned_act_enabled = false            # Banked-owned-act-reperformance shield

# Owned-act-drought (rule 18) — a self-releasing consequence for a zero-count of
# chosen terminal acts. When zero owned terminal acts (mark_plan_obsolete
# obsolete plan-status events + CHOSEN stand-down verdict rows) landed in the
# last owned_act_drought_window cycles AND at least owned_act_drought_min_backlog
# prunable pending_review plans exist, emits one [audit] finding routing the
# owned-act demand into next_task_directive. Self-extinguishes the instant one
# owned act of either kind lands. Default-on (a default-off flag binds nothing);
# zero SDK cost.
owned_act_drought_enabled = true            # Rule 18 master switch
owned_act_drought_window = 5                # Recent task cycles the window spans (>= 1)
owned_act_drought_min_backlog = 2           # Prunable pending_review plans required to fire (>= 1)

# Branch-promotion-pressure master switch (proposal 116, step 6). Default-on =
# today's behaviour. When false, every site that manufactures pressure to promote
# a kept task branch into main via a source_task_id follow-up goes silent at once:
# audit rule 7, the two task-gate directive bridges, the three task-generation
# promotion hints, the kept_task_branches_v1
# seed limitation mirror, and the step-5e merge-clean auto-direction. Zero SDK cost.
branch_promotion_pressure_enabled = true    # [production: false — prod-disabled, proposal 116] Master switch for the branch-promotion-pressure subsystem

# Retire-unlanded-limitations fuel-starve (proposal 116) — before surfacing a
# limitations_known entry as a [limitation] open question, contemplate() measures
# the unlanded plan debt its question-lineage has accrued (tasks whose
# linked_question falls in the lineage, and the obsolete/rejected evolution plans
# citing those tasks via source_task_id). A limitation at/over
# generative_debt_threshold such plans is not re-surfaced, so it stops anchoring
# new self-directed work. Self-extinguishing (debt recomputed from git-and-ledger
# truth each cycle); zero SDK cost. Default on since the proposal-116 graduation;
# false restores mirroring every limitation.
retire_unlanded_limitations_enabled = true  # Proposal 116 master switch
generative_debt_threshold = 3                # Unlanded plans in a lineage before its limitation is starved (>= 1)
self_calibration_enabled = false             # [production: true — canary, proposal 129] Proposal 129 — priced reflection states its loss condition in the oracle grammar + a CONFIDENCE; rows gain confidence + probe kind (off: byte-identical)
calibration_verdict_authority_enabled = false  # [production: true — canary, proposal 129] Proposal 129 — the oracle (author_reflection_verdict), not the PRIOR VERDICT self-grade, authors the reflection ledger verdict; divergence traced (off: byte-identical)
evidence_bound_claims_enabled = false        # [production: true — canary, proposal 129] Proposal 129 — update_self_model cites each capabilities_known claim to a task/SHA/sensor-tag anchor, resolved into SelfModel.claim_evidence (existence+polarity); off: no key read, prompt byte-identical
closed_reference_enabled = false             # Rule 23 — flag a self-model entry whose every cited #NNN is closed on the host (bounded gh api lookups, zero SDK cost)
refutation_accountability_enabled = false    # [production: true — canary, proposal 129] Proposal 129 Phase C — a refuted mechanical_fact audit finding that keeps re-firing on the same target is mechanically restored to its canonical [audit] form; derived/heuristic rules stay refutable (off: open_questions byte-identical)
refutation_rejection_cycles = 3              # Consecutive re-firing cycles before a refuted mechanical-fact finding is overturned (>= 1)

[cli]
journal_default_count = 10    # Default journal entries to display
log_tail_lines = 50           # Default log lines to display
verbose = false               # Enable debug logging

[telegram]
max_length = 4096       # Max Telegram message length before truncation

[logs]
dates_shown = 5            # Recent date directories shown in SDK session listing
session_data_days = 10     # Recent date directories included in session data API
max_bytes = 52428800       # Rotate maestro.log past ~50 MiB (>= 1)
backup_count = 3           # Keep maestro.log.1 … maestro.log.N backups (>= 1)
structured_transcripts_enabled = true  # Write provenance-stamped .jsonl transcript sidecars next to SDK .log files (default-on; a session with no sidecar still renders from its raw .log)
transcript_content_max = 20000  # Per-turn content cap for the .jsonl transcript sidecar (>= 1; independent of the .log truncate bound)

[ci]
cov_fail_under = 97     # Minimum test coverage percentage for self-review

[models]
# Model ID used for every Maestro SDK call; it must have a profile in
# maestro/model_profiles.py (keep equal to DEFAULT_MODEL there). The per-call
# effort level is the only thinking control. Empty string = inherit SDK default.
default = "claude-opus-4-8"
fallback = ""  # Fallback model when primary unavailable (empty = disabled)
# Targeted opt-in 1M-context model variant. Empty string = disabled (the
# default). When non-empty, three call sites switch to this model and a
# matching enlarged char/budget cap: self_review diff, conflict
# resolution, and (when [loop] long_context_implementation_enabled is
# also true) the per-plan implementation session. The model string is
# passed verbatim as `--model` and Maestro injects the SDK's
# `context-1m-2025-08-07` beta automatically when this is set, so the
# full 1M-token window is available. 1M-tier pricing comes from the model
# profile's long_context_pricing in maestro/model_profiles.py.
long_context = ""

[sdk]
# Sticky ``allowed_warning`` throttle — fires before every SDK ``query()``
# call (not just between loop iterations). When the API emits an
# ``allowed_warning`` event, the multiplier doubles (capped at 16); when
# a clean call runs, the hysteresis counter increments and the multiplier
# halves once hysteresis is reached. Actual pre-call sleep is
# ``base_seconds * multiplier`` capped at 1800s. See CLAUDE.md for the
# full state machine.
warning_throttle_base_seconds = 10
warning_throttle_hysteresis = 3
warning_hold_threshold = 3      # Consecutive max-multiplier warnings before loop-level hold
warning_hold_probe_interval = 60  # Base seconds between hold probe calls (exponential backoff)
warning_hold_min_utilization = 0.95  # Warned utilization below this slows calls but never holds the loop (#4514)
# Rate-limit extended idle — fires when in-place rate-limit retries hit
# the _MAX_CONSECUTIVE_RATE_LIMITS ceiling (5). The loop enters an idle
# state and probes the API with exponential backoff (base * 2**attempt,
# capped) until one probe succeeds. Replaces the previous crash-on-ceiling
# behavior so sustained outages pause the loop instead of generating a
# false-positive crash issue.
rate_limit_idle_probe_interval = 300       # Base seconds between rate-limit idle probes
rate_limit_idle_max_probe_interval = 3600  # Cap on the exponential-backoff probe interval
max_concurrent_queries = 2      # Max parallel SDK query() calls (semaphore limit)
# Evolution-lineage calls run on their own single-use session at their registry effort.
single_use_evolution_calls_enabled = false  # [production: true — canary, proposal 139]
# Seam resolves each call's effort from the call-policy registry; needs the flag
# above and [loop] self_review_own_session_enabled.
call_policy_resolution_enabled = false  # [production: true — canary, proposal 140]
# Seam derives each call's tools from its caller's declared tool surface (proposal 142).
enforced_tool_surface_enabled = false  # [production: true — canary, proposal 142]
stream_idle_timeout_seconds = 180  # Per-message SSE wait_for() deadline (0 disables)
# Idle timeout for tool-using callers (implement / self-review / auto-fix /
# executor). Longer than stream_idle_timeout_seconds because effort=high +
# multi-step tool use legitimately produces long
# silent stretches (thinking between tool calls is not streamed), and a caller
# that shells out to run the quality gates is silent for the whole run. Must be
# strictly greater than `[timeouts] selfcheck_max` (validated); 0 disables.
# Trade-off accepted when this was raised from 600: a genuinely dead stream now
# takes 3 x 1800s to trip `_MAX_CONSECUTIVE_STREAM_STALLS` instead of 3 x 600s.
# Narrowing the net per-caller (so a gate-running step gets the long net and an
# ordinary tool step a short one) is deliberately out of scope here.
tool_stream_idle_timeout_seconds = 1800
task_budget_tokens = 0          # Per-call token budget (0 = unlimited, >= 1024 when enabled)
# Provider selection (proposal 058). Picks which Provider backs the four SDK
# seam functions. Values:
#   "anthropic" (default) — today's exact AnthropicProvider path.
#   "openai"              — OpenAI reference provider (Phase 3: query path landed,
#                           not yet registered — selecting it fails loud below).
#   "cli_paced"           — human-paced claude-CLI provider (056 / Phase 4). The
#                           CLI path reports total_cost_usd=None (usage_metering=
#                           False) and cannot forward MCP servers, betas, in-stream
#                           completion predicates, or resume.
# Selecting a not-yet-registered name fails loud at startup (configure_provider).
# Optional per-phase override: add `<phase>_provider = "..."` for any phase in
# {contemplation, evolution, implementation, task_generation, artifact_review,
# rejection, run_task}, e.g. `artifact_review_provider = "openai"`.
provider = "anthropic"
enable_session_reuse = true     # Share ClaudeSDKClient session across sequential step tiers

# cli_paced provider pacing + idle overrides (proposal 056 Step 12). Only applied
# when `provider = "cli_paced"` (or a `<phase>_provider = "cli_paced"` override) is
# selected. Left commented so the shipped defaults stay at maestro_sdk's documented
# Cadence() and its built-in 10s idle deadline. Uncomment + tune as needed:
#   stream_idle_timeout_seconds — CLI-path idle deadline a caller inherits when it
#     passes no per-call override (0/absent → maestro_sdk's 10s default). The CLI
#     path does NOT inherit the agent-side [sdk] stream_idle_timeout_seconds.
#   Cadence knobs (ms unless noted): mean_key_ms, stddev_key_ms, min_key_ms,
#     word_pause_ms, sentence_pause_ms, thinking_pause_prob (0..1),
#     heartbeat_min_ms, heartbeat_per_answer_char_ms, heartbeat_max_ms,
#     cols, rows, size_jitter (0..1 winsize jitter).
#   Slash-command metrics probe (proposal 062): probe_metrics_enabled scrapes
#     /cost, /usage, /context on session turns as an observability side channel
#     (the transcript sidecar stays authoritative for spend); probe_metrics_every
#     (>= 1) amortises the probe over N turns. Needs a per-CLI-version
#     SlashProbeMarkers pack to parse anything — unparsed redraws read as None,
#     never a fabricated count.
#   Marker pack (proposal 075): marker_pack = "auto" probes `claude --version`
#     at startup and applies the newest registered pack covering that version
#     (WARNs and runs pack-less when none covers — EOF-only turns, no
#     session-id capture); a pack name pins one explicitly (a typo fails loud
#     at config validation); "none" (default) keeps the empty markers.
# [sdk.cli_paced]
# stream_idle_timeout_seconds = 180
# mean_key_ms = 90
# heartbeat_per_answer_char_ms = 12
# probe_metrics_enabled = false
# probe_metrics_every = 1
# marker_pack = "none"

# Per-model pricing (USD per million tokens, standard and 1M-context) lives
# in maestro/model_profiles.py (MODEL_PROFILES, projected by pricing_table())
# and is not mirrored here. An operator may still add an
# [sdk.pricing."<model>"] group (input / output / cache_creation / cache_read)
# as an override; a non-empty group replaces the registry projection wholesale.

[messaging]
max_length = 2000       # Max inbound message content length

[email]
smtp_host = "smtp.zoho.com"
smtp_port = 587
imap_host = "imap.zoho.com"
imap_port = 993
max_length = 50000      # Max email body length

[mcp]
context7_enabled = false  # [production: true — canary, proposal 084] Enable Context7 MCP server for library documentation
context7_command = "npx"
context7_args = ["-y", "@upstash/context7-mcp"]

# Serena — opt-in symbol-level code retrieval (default off). Version-pinned so the
# tool inventory cannot drift; mutating tools are denied so the server is read-only.
serena_enabled = false    # Enable Serena symbol-retrieval MCP server
serena_command = "uvx"
serena_args = ["--from", "serena-agent==1.5.3", "serena", "start-mcp-server"]

[review]
max_diff_chars = 80000  # Max diff size for review
max_files = 50          # Max files to review
gh_timeout = 30         # GitHub CLI timeout
require_comment_replies = 0  # Reply-coverage gate default (0 = off); consumed by maestro-review's --require-comment-replies check-only flag

[artifacts]
# Artifact-review pipeline — inspects artifacts/{task_id}/ output from
# completed tasks and classifies each as publish / improve / reuse / skip.
# Verdicts are persisted to artifact_reviews.jsonl. Publish verdicts
# are recorded but do NOT emit publication proposals in 031 — that
# behaviour lands behind [publication].enabled in proposal 032.
review_enabled = true               # Master switch
review_every = 20                   # Run review phase every N iterations (>= 1)
review_batch_size = 3               # Max tasks reviewed per batch (>= 1)
review_max_file_bytes = 4096        # Per-file head-truncate cap (>= 1)
review_max_files_per_task = 10      # Max files included per task bundle (>= 1)
review_max_bundle_bytes = 12288     # Total bundle size cap (>= 1)

[publication]
# Publication pipeline — turns publish-verdict reviews into public GitHub
# repos. Gated behind its own enabled flag. Proposal 032 activates the
# approval surface (Telegram + dashboard) so publish verdicts emit
# PublicationProposal records that Thomas approves or rejects. Approved
# proposals queue in status="approved" with no side effect until
# proposal 033 lands the executor — a reversible dogfooding window.
enabled = true                          # 032: approval surface active; 033 runs the publisher
owner = "thomas-sodon"                  # GitHub namespace publications are created under (empty = the authenticated gh login)
copyright_holder = "Thomas Sodon"
license = "MIT"
secret_scan_enabled = true              # Run hard-block scan on full files before push
executing_stale_timeout_seconds = 600   # Stale-executing downgrade threshold (>= 60)
push_retry_limit = 3                    # Resume-path git-push retry ceiling (>= 1)

[evolution_fuel]
# Proposal 155 gap issues: the most plans one gap may fuel, and the hours a
# red ``main`` is tolerated before it opens a ``maestro:gate`` gap.
max_plans_per_gap = 2
red_main_grace_hours = 12.0
# GitHub logins whose gap:* label or hand close is the operator's. Never the
# loop's own login — startup refuses it.
operator_github_logins = []
