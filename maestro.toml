# remediation rather than skipped as Tend-clearable.
merge_block_local_probe_enabled = true         # Master switch

# PR-ledger attempt budget — maximum remediation attempts per origin-head SHA.
# Head movement resets the budget; exhausted budget latches PR as stuck.
pr_remediation_max_attempts_per_head = 3       # Attempts per head before stuck (>= 1)

# Per-PR lap budget across ALL heads (proposal 080 Phase 3). Counts cumulative
# remediation laps that landed nothing per the host-API merge oracle; head
# movement does NOT reset it. At budget, Tend delivers one merge-or-close
# handoff, writes a durable pr_number-keyed standdown, and stops minting laps
# for that PR until the host reports it merged/closed. 0 disables the standdown.
pr_remediation_lap_budget = 6                  # Cumulative unlanded laps before standdown (>= 0; 0 disables)

merge_truth_ttl_seconds = 300                  # Proposal 087: max age (s) a memoized MergeTruth may author a verdict before is_pr_settled re-observes (>= 0; 0 always re-observes)
prestamp_merge_truth_gate_enabled = false      # [production: true — canary, proposal 087] Proposal 087: downgrade a remediation success naming #N to partial at write time when is_pr_settled reports it unmerged (default off)
observed_ready_standdown_enabled = true        # Proposal 089: dequeue-evict an open PR whose every code-clearable blocker is clear with a zero-cost partial [ready] stand-down (default on)
ci_pending_hold_dequeue_enabled = true          # Yield the remediation slot (PR left queued, no session/eviction/stand-down) for an owned open PR whose sole live blocker is CI still running — no conflict, no failing gate, no unaddressed AI thread — so CI concludes on its own clock (default on)
ci_pending_green_handoff_enabled = false      # #3630: one-shot green-handoff arm on the CI-pending hold — when CI-pending is the sole live blocker, run the demanding local gates (ruff → mypy) and on all-passed deliver one merge-or-close handoff + pr_number-keyed stand-down before yielding as today (default off)
salvage_before_disengage_enabled = true        # Proposal 094: gate both stand-down writers on the pure pr_salvage oracle — refuse to stand down an open own PR with a code-clearable blocker whose work is not disposable; also activates the progress-exhaustion-gated merge-or-close handoff (default on)
mergeable_merge_request_enabled = false        # Mergeable-flip actuator: at record time, send exactly one named merge-request (via deliver_handoff) for a PR-remediation verdict whose PR is clean-but-unlanded and whose sole blocker is external+mergeable-terminal (AWAITING_APPROVAL; the wired readiness caller never emits AWAITING_PUSH), keyed idempotent on a (pr, head_sha) serviced marker (default off)
frame_discharge_bind_enabled = false           # Proposal 112: frame–discharge costume cap — at record time, cap a self-directed task's success to partial when its goal is investigation-framed but its discharge is tracked construction (a kept branch), via frame_discharge.assess_frame_discharge + bind_costume_discharge_to_partial in run(); domain-disjoint from the §5d landing authority (default off)
wip_primacy_enabled = true                     # Proposal 092: highest-precedence block gate — finish an open own PR with a self-clearable blocker (CONFLICTING/THREADS_UNRESOLVED) before starting new work (default on)
refutable_standdown_enabled = false            # [production: true — canary, proposal 135] Proposal 135: third standdown release path — drop a handoff-ready latch the live owed-act reading refutes (e.g. a sibling merge turned the handed-off PR CONFLICTING), composed from facts the tend walk already measured (default off)
standdown_refutation_release_cap = 2           # Proposal 135: budget for the refuted-release path — how many times one PR's handoff-ready latch may be released by refutation (each release withdrawing its own stand-down message) before the latch becomes permanent and one terminal message says so once
owned_act_preempt_enabled = false              # Owned-act preemption of the stalled-remediation yield slot: when the rule-18 owned-act-drought predicate is active (zero owned terminal acts in-window AND a prunable pending_review backlog), a stalled pending_pr_requests head that would yield its slot to the next non-stalled remediation entry (#2837) is instead redirected to the owned mechanical prune (sweep_clustered/restatement_pending_plans) so a stuck cycle moves net pending_review instead of re-lapping an externally-addressed PR; reuses the existing drought predicate (self-extinguishes on one owned act in-window) and sweep. Setting this false restores the byte-identical yield-to-next-remediation selection (default off, experimental)
multi_pr_proposals_enabled = false             # Proposal 118: chain-emission arm of multi-PR evolution proposals. When true, evolve() routes the gap block through propose_plan_chain — an intent too large for one PR is decomposed into an ordered chain of thin slice plans owned by one EvolutionProposal, and only the head (phase_index 0) slice is submitted for the usual per-slice human review while the rest persist dormant ("sliced" status); a single-PR intent (or fewer than two valid slices) collapses to the lone-plan path. Setting this false keeps evolve() calling propose_plan → submit_for_review exactly as before (default off, experimental)
unwinnable_race_re_entry_threshold = 3         # Proposal 099 (step 8): the per-PR base-advance re-entry count at/above which the unwinnable-race heads-up fires (int >= 1). Always read — _audit_self_model escalates unconditionally (proposal 099 flags collapsed per proposal 117)
require_claude_md_update = false               # Proposal 108: make the CLAUDE.md-maintenance mandate opt-in. When true the evolution prompts (propose_plan/implement/self_review) and the planner's doc-update nudge carry the legacy hard mandate ("Every evolution MUST update CLAUDE.md"); when false (default) they carry the soft conditional guidance already codified in the Evolution Protocol ("update CLAUDE.md only if an invariant changed"). The loop never reads CLAUDE.md at runtime, so the mandate only manufactured cap-vs-mandate churn (default off)
session_landing_enabled = false                # Post-session mechanical landing actuator: after a remediation session and before verdict composition, mechanically commit+push gate-clean working-tree edits on the owned maestro/{task,evolve}/* branch (green-gated, rewind-on-red, owned+oracle-gated), then ground the verdict on the post-push is_pr_settled read (default off)
obligation_fork_floor_enabled = false          # PR #3211: wire the obligation-fork verdict floor into run() — §4c records an obligation-fork marker (git rev-parse HEAD vs origin/<pr_branch>) beside the fetch-truth marker, and §4e passes owned_awaiting_push (derived from classify_blocker_ownership on this lap's merge-block) to gate_remediation_verdict, so its [fork-missing]/[push-owed]/fetch-gated pass-through arms fire on an owned unpushed head. Default off: the gate is called without the flag and no fork marker is written, keeping the floor inert until the pending push actuators co-activate it
owned_committed_push_actuator_enabled = true   # Committed-but-unpushed push actuator: in _record_remediation_outcome, mechanically fire the owed git push on a gate-clean committed owned head ahead of origin/<pr_branch> under an AWAITING_PUSH blocker (the committed-work sibling of the always-on uncommitted-edit arm). Green-gated (RED reset-to-origin rewind, never a red head), oracle-gated, delivery bound to a same-turn verify_push_advanced_remote_head read, self-extinguishing once the remote catches up. Default on (promoted): flip false to restore the legacy path where the push surfaces only as an OWNED_PUSH_AVAILABLE marker
progress_aware_lap_budget_enabled = false      # Proposal 089: trigger the merge-or-close handoff on consecutive no-progress laps instead of gross unlanded laps (default off)
dropped_directive_replay_enabled = false       # Proposal 090: replay a fire-or-close directive that lost the one-shot-slot race via a durable dropped_directives.jsonl ledger + lowest-precedence task gate (default off)

# Uncalled-symbol quality gate — post-self-review blocking gate that
# rejects evolution steps shipping new definitions (def/class) without at
# least one non-test call site. Configurable threshold: steps introducing
# more uncalled symbols than uncalled_symbol_max_allowed are failed.
