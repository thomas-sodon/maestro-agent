readmission_construction_directive_enabled = false  # Master switch (default-off)
readmission_construction_ratio_threshold = 0.5      # Readmission rate at/above which it fires [0.0-1.0]

# Remediation repetition gate — after N consecutive no-op remediations of the
# same PR, _tend_single_pr stops re-routing until the branch receives new
