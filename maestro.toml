# Maestro Configuration — base defaults (committed to repo)
# Environment overlays: maestro.{env}.toml (selected via MAESTRO_ENV env var)
# Priority: maestro.toml < maestro.{env}.toml
# Values are base defaults. A [production: …] tag marks a key maestro.production.toml overrides; the tag names the production value.
# Secrets remain in environment variables (see CLAUDE.md for the list).

[paths]
workspace = "."           # Git repository root (relative to cwd or absolute; ~ expanded)
memory_dir = "data"       # Persistent state directory (relative to cwd / repo root)
sqlite_state_enabled = false  # Route the candidate-task queue (SqliteTaskQueue), per-SDK-call cost samples (SqliteCostSampleStore), the deed ledger (SqliteDeedLedger), the owned-backlog snapshot ledger (SqliteOwnedBacklogLedger), the PR-admission provenance ledger (SqlitePrProvenanceLedger), the obligation-fork marker ledger (SqliteObligationForkLedger), the fetch-truth marker ledger (SqliteFetchTruthLedger), the preflight-pass ledger (SqlitePreflightPassStore), the dropped-directive replay ledger (SqliteDroppedDirectiveLedger), the settled-verdicts pre-filter (SqliteSettledVerdictsLedger), the stand-down verdict ledger (SqliteStandDownVerdictLedger), the unconfirmed-own-landing first-seen sidecar (SqliteUnconfirmedOwnLandingStore), the orphaned-cure first-seen sidecar (SqliteOrphanedCureStore), the impact-review surfaced-set sidecar (SqliteImpactReviewSurfacedStore), the mergeable-flip serviced-marker ledger (SqliteMergeRequestServicedStore), the on-settlement record-reconciler provenance ledger (SqliteSettlementReconciliationLedger), the owned-lever-attempts ledger (SqliteLeverAttemptsLedger), the audit-history ledger (SqliteAuditHistoryLedger), the rejection-history ledger (SqliteRejectionHistoryLedger), the question-resolution ledger (SqliteQuestionResolutionLedger), the gate-activation trace ledger (SqliteGateActivationLedger), the prediction sensor ledger (SqlitePredictionLedger), the version-archive ledger (SqliteVersionArchiveLedger), the per-PR remediation ledger (SqlitePRLedger), the per-PR remediation-repetition tracker (SqliteRemediationTrackerStore), the escalation-standdown ledger (SqliteEscalationLedger), AND the conscious-episode ledger (SqliteConsciousEpisodeLedger) through memory_dir/state.db instead of task_queue.json / cost_samples.jsonl / deed_ledger.jsonl / owned_backlog_ledger.jsonl / pending_pr_provenance.jsonl / obligation_fork_markers.jsonl / fetch_truth_markers.jsonl / preflight_passes.json / dropped_directives.jsonl / settled_verdicts.jsonl / stand_down_verdicts.jsonl / unconfirmed_landing_first_seen.json / orphaned_cure_first_seen.json / impact_review_surfaced.json / mergeable_merge_requests.json / settlement_reconciliations.jsonl / lever_attempts.jsonl / audit_history.jsonl / rejection_history.jsonl / question_resolutions.jsonl / gate_activations.jsonl / predictions.jsonl / version_archive.jsonl / pr_ledger.json / remediation_tracker.json / escalation_handoffs.json / conscious_episodes.jsonl; the JSONL/JSON sidecars are retained as flag-off rollback. Also builds the persistent journal-search FTS5 index (SqliteJournalSearchIndex) in state.db — a derived cache that tops itself up with only newly-appended entries instead of rebuilding per search, over the append-only journal.jsonl (retained unchanged as source of truth and flag-off rollback) (proposal 106, default off)

[github]
repo = ""                 # GitHub repo in owner/repo format (empty = not configured)
reviewer = ""             # GitHub username to request PR reviews from (empty = no reviewer)
issues_page_size = 5      # Issues fetched per gh API call (page size, >= 1)

# Work target (proposal 107) — the single owner for which repo, which gate path
# atoms, and which framing the loop points its effort at. Every facet below
# defaults to Maestro's own values, so a build with this section unchanged is
# byte-for-byte identical to current behaviour. Every facet is live:
# repo_workspace / github_repo redirect the git / GitHub clients (sites still
# bound to paths.workspace are not redirected — see
# tests/test_work_target_chokepoint.py); focus_profile = "external_delivery"
# suppresses the evolve, audit_self_model and curate_pending_plans phases;
# task_framing selects the task-generation and evolution prompts.
# focus_profile / task_framing must be "self_evolution" or "external_delivery".
[work]
focus_profile = "self_evolution"    # How much the loop favours delivery over introspection
task_framing = "self_evolution"     # How task-generation / evolution prompts frame work
repo_workspace = ""                 # Git checkout to operate on (empty = fall back to paths.workspace)
github_repo = ""                    # PR target in owner/repo format (empty = fall back to github.repo)
gate_source_path = "maestro/"       # Source-tree atom the quality gates lint/type-check
gate_tests_path = "tests/"          # Tests atom the quality gates run
gate_lint_extra_paths = ["scripts/"] # Extra atoms ruff/mypy cover (never pytest), matching CI;
                                     # retargeting source/tests at another package must also set this (e.g. [])

[timeouts]
# All values in seconds
git = 30                # General git operations (checkout, add, commit, push)
git_quick = 10          # Fast git operations (rev-parse, status)
selfcheck = 900         # Quality gates (ruff, mypy, pytest); the floor a derived
                        # pytest budget starts from. Must fit a clean full suite.
# Hard cap on the per-run pytest budget the gate execution lease may derive
# (`[loop] gate_budget_lease_owned_enabled`). `selfcheck` stays the ruff/mypy
# ceiling and the floor a derived deadline starts from; this bounds how far a
# repeatedly-killed suite may escalate, so a genuine hang still dies. The
# ordering `selfcheck <= selfcheck_max < [sdk] tool_stream_idle_timeout_seconds`
# is enforced in `Config._check_cross_field_and_subtable`: the idle net must sit
# above the largest budget one gate run may spend, or the stream is declared
# stalled before the suite can answer.
selfcheck_max = 1350    # Hard cap on a lease-derived pytest budget
implement = 120         # git push during evolution implementation
pr_creation = 60        # PR creation via gh CLI
gh = 30                 # GitHub CLI operations (issues)
shutdown = 10.0         # Dashboard graceful shutdown

[dashboard]
port = 8420
host = "127.0.0.1"            # Loopback by default; the production overlay binds 0.0.0.0 in the container
rejection_reason_max = 2000   # Max length of plan rejection reason
max_page_size = 500           # Max items per API page
log_buffer_size = 500         # In-memory log ring buffer size
trust_forwarded_proto = false # Set true when behind a TLS-terminating reverse proxy
# Public-API hardening — applied by PublicApiMiddleware to every /api/public/* route.
# trust_forwarded_for: read X-Real-IP (set by nginx to $remote_addr) as the
#   rate-limit key (production overlay sets this true; nginx is the sole trusted hop).
# public_api_rate_limit_per_minute: per-(ip, path) request cap, sliding 60s window.
# public_api_cache_max_age_seconds: Cache-Control max-age / s-maxage; SWR is 2x.
# security_headers_enabled: master switch for SecurityHeadersMiddleware (CSP etc.).
trust_forwarded_for = false  # [production: true — operational]
public_api_rate_limit_per_minute = 60
public_api_cache_max_age_seconds = 30
security_headers_enabled = true
# Authenticated-mutation rate limits (proposal 022) — per client IP, sliding
# 60s window, enforced by MutationRateLimitMiddleware only when auth is on.
# login_rate_limit_per_minute: POST /login attempts (brute-force guard).
# approval_rate_limit_per_minute: plan/publication approve+reject POSTs.
login_rate_limit_per_minute = 10
approval_rate_limit_per_minute = 30
account_ui_v2 = true           # Gates the v2 account-dashboard navigation shell (proposal 122); false rolls back to the flat pill nav

[loop]
interval = 60           # Seconds between autonomous loop iterations
evolve_every = 5        # Run evolution cycle every N iterations
task_every = 3           # Generate self-directed task every N iterations
task_queue_max = 8       # Soft cap on candidate-task queue; generate phase stops enqueueing at cap
dream_every = 10         # Run the dream phase's zero-SDK passes (phase-cost report, value reconciliation, brief expiry, archive) every N iterations (0 disables)
audit_self_every = 10    # Mechanical self-audit: rules over (tasks, errors, self-model) every N iterations (0 disables)
contemplate_every = 1    # Run the priced contemplation phase (introspect + update_self_model) every N iterations (1 = every iteration, 0 disables)
# Pending-plan curation (proposal 060). Turns on an autonomous LLM phase that
# rewrites stale pending_review plans BEFORE human review — opt-in by design.
# Both keys must be set (curate_enabled = true AND curate_every > 0) to enable.
# Results surface via the dashboard's existing "Refined:" column (no UI change).
curate_every = 0         # Refine oldest unrefined pending_review plan every N iterations (0 disables)
curate_enabled = false   # [production: true — operational] Master switch for the curate_pending_plans phase (autonomous plan rewrite)
curate_min_plan_age_hours = 0.0  # Grace period (float hours) a fresh plan must age past before curation may touch it (0 = no delay)
plan_feedback_enabled = false  # [production: true — canary, proposal 145] Proposal 145: curate plans with unaddressed reviewer feedback first (bypasses the grace period); the curator must answer the feedback, and a 3-strike release frees what it cannot act on; also fires the curate phase off-cadence while a pending plan holds unaddressed feedback
curate_skip_serviced_enabled = false  # When true, select_curation_target excludes plans already serviced once (refined_at OR last_curated_at set) from the normal curation lanes, so curate_pending_plans takes its zero-cost None return even after a serviced plan's content or feedback changes (the curated_hash skip already drops unchanged plans). The reviewer-feedback priority lane is exempt.
# Duplicate-pending-plan guard: submit_for_review refuses to mint a new plan
# that near-restates an unreviewed pending_review plan, reusing the zero-cost
# content-word Jaccard machinery behind detect_restatement at this cutoff.
duplicate_pending_plan_threshold = 0.5  # Jaccard cutoff (mirrors RESTATEMENT_THRESHOLD); > 1.0 disables the guard
# Cluster-level extension: when this many open pending_review plans share the
# candidate's dominant-token theme, the candidate lands obsolete instead of
# adding a sixth themed restatement to the review pile (closes the pairwise
# guard's blind spot to themed backlogs).
pending_plan_cluster_threshold = 2  # Min themed pending plans before a new restatement is blocked
# Cluster-level pending-plan stop: refuse to mint a plan when this many pending
# plans already share its theme (looser Jaccard than the duplicate guard above).
pending_cluster_threshold = 0.35  # Looser Jaccard cutoff for theme-cluster membership
pending_cluster_max = 2           # Land plan obsolete once this many pending plans cluster with it (<= 0 disables)
# Mechanical pending-plan cluster sweep: generate_task drains redundant backlog
# by marking all-but-the-newest member of each qualifying pending cluster obsolete
# (zero-SDK, no approval), reusing the two thresholds above. Set false to disable.
pending_cluster_sweep_enabled = true
# Mechanical pending-plan restatement sweep: generate_task also retires every
# pending plan that restates a strictly-newer surviving pending plan (keeping the
# newest of each chain), capturing each fire to lever_attempts.jsonl. Reuses the
# duplicate_pending_plan_threshold Jaccard cutoff. Set false to disable.
restatement_sweep_enabled = true
# Directive-named obsolete actuator: audit_self_model (zero-SDK, runs even with
# self_directed_tasks_enabled = false) retires the single pending plan a
# next_task_directive names for mark_plan_obsolete, records an owned_prune deed,
# and clears the directive. Set true to enable.
obsolete_directive_actuator_enabled = false
# Concept-key restatement matching: fold self-model tokens through
# lexicon.concept_key (hyphenation + light morphology collapse) so a re-coined
# synonym is caught as a restatement, not scored as a discovery. Set true to enable.
restatement_concept_key_enabled = false
# Backlog-saturation submit-block: submit_for_review hard-refuses a new pending
# plan once the open pending_review backlog reaches this count, forcing land-or-
# dispose before more production (caps total, not just redundant, plans).
pending_plan_submit_block_threshold = 5  # Refuse new plans at/above this pending_review count (<= 0 disables)
# Mechanical pending-plan expiry sweep: generate_task also auto-obsoletes every
# pending_review plan older than this many days (disposal, not rejection — an
# approval moves a plan out of pending_review and is the explicit hold).
plan_review_expiry_days = 21  # Auto-obsolete pending_review plans older than N days (<= 0 disables)
max_replans = 1          # Max re-planning attempts per task on step failure (0 disables)
# Caps consecutive remediation slots: after this many task slots in a row served
# from pending_pr_requests, the next slot bypasses remediation and falls through
# to the queue head, forcing task-shape diversity (breaks remediation-monoculture
# where unlanded PRs re-feed the scheduler every iteration). <= 0 disables the cap.
max_consecutive_remediation = 4  # Max consecutive pending_pr_requests slots before forcing a non-remediation task (<= 0 disables)
checkpoint_max_age_days = 7  # Startup sweep deletes task checkpoints older than this (0 disables)
post_implement_review = true  # Run quality gates after implement(), before creating PR
task_branch_reuse_enabled = true  # [production: false — prod-disabled, proposal 116] Proposal 116 master switch: reuse a kept task branch as an evolution-PR base via source_task_id; flag-off bases every evolution PR fresh-from-main
planning_excludes_remediation_enabled = false  # Drop "Remediate PR #<n>:" laps from the planner's kept-branch candidates and source_task_id validation (their branch is an open PR head)
self_directed_tasks_enabled = true  # [production: false — prod-disabled, proposal 116] Proposal 116 master switch: schedule generate_task on the task_every cadence; flag-off gates off self-directed generation while external/PR-remediation work keeps running
generation_admission_enabled = true  # Proposal 116 step 7 (default on since the proposal-116 graduation; false restores the un-gated submission): admission gate on submit_for_review — refuse a net-new mint when the pending backlog is saturated or the candidate's self-measurement theme dominates the recent obsolete graveyard, and write one prune/land directive
generation_admission_theme_fraction = 0.75  # Themed fraction of the recent-obsolete window at/above which the candidate's self-measurement theme "dominates" ([0.0, 1.0])
generation_admission_window = 20  # Size of the recent-obsolete window fed to the theme-saturation metric (>= 1)
pre_mint_generation_gate_enabled = false  # [production: true — canary, proposal 120] Proposal 120 Phase B (default off = today's behaviour): the single pre-mint owner for both self-initiated plan-mint channels (evolve()'s fuel-gated propose_plan tail and _implement_approved_plans) — consult generation_gate.may_mint_plan on the same backlog/theme inputs and, when saturated, skip that channel's work while writing one prune/land directive; the submission-side generation_admission_enabled gate stays the downstream backstop
self_model_external_anchor_enabled = false  # [production: true — canary, proposal 120] Proposal 120 Phase C (default off = today's behaviour): anchor update_self_model's limitations_known vanity filter to external-observable capability — a limitation qualifies only if it names an external-observable capability, behaviour, or audience effect, not solely the loop's own plan-mint / PR-remediation plumbing, with that inward-plumbing case called out as vanity by example; off leaves the update_self_model prompt byte-for-byte unchanged
# Evolution PR tending — keeps open evolution PR branches updated with
# main (merge-only, never rebase, never force-push) so they stay
# reviewable. Tapered reminders (48h/72h/168h) nudge Thomas on unreviewed
# PRs. Set tend_prs_enabled=false to disable the phase entirely.
tend_prs_enabled = true  # Master switch for evolution-PR tending phase
tend_prs_every = 1       # Run tending every N iterations (top priority — runs every iteration by default)
tend_bug_comments_enabled = true  # Route a remediation task when an open PR has unresolved AI 🐛 bug review comments
tend_planless_prs_enabled = true  # Keep tending an open evolution PR even after its plan leaves 'implemented' (retired/obsolete)
tend_main_merge_enabled = true  # [production: false — prod-disabled, proposal 128] Gate the tend phase's origin/main merge-and-push (reversible merge-queue cutover kill-switch, proposal 128); default on preserves current behaviour, flip to false alongside enabling GitHub's merge queue on main
resolve_addressed_threads_enabled = true  # After a remediation lap delivers replies + pushes, resolve the addressed AI-finding threads (never human threads)
gate_strip_redirections_enabled = true  # Strip shell redirections (2>&1, > out) from a task-execution Bash segment before the action gate reads a git-push refspec, so an output-captured own-branch push is no longer mis-parsed and fail-closed (default on — stripping only converts a fail-closed deny of an owned non-force push to allow; main/master, force-pushes, out-of-set and unparseable pushes stay denied; rollback: flip to false) (proposal 096)
user_request_blocks_standdown_enabled = true  # Refuse to author either stand-down verdict for a PR while an unconsumed pending_user_requests message names that PR (#NNNN / PR NNNN)
user_pr_message_remediation_enabled = true  # Route a human message naming an open own PR as a full PR-remediation task, releasing that PR's stand-down suppressions first
pr_ready_for_review_notify_enabled = true  # Telegram-ping Thomas when a PR is synced with main, comments addressed, and ready to re-review
conflict_resolution_cooldown_hours = 24.0  # Min hours between conflict-directive re-routes on the same PR
quality_fix_cooldown_hours = 24.0  # Min hours between quality-gate-directive re-routes on the same PR (after a tend-cycle merge)
cooldown_backoff_base_hours = 1.0  # First rung of the bounded backoff both tend cooldowns decay through on an unchanged signature; doubles per genuinely-bounced attempt — a bypassed, pushing or unmeasurable lap consumes no rung — capped at the cooldown's own hours ceiling (proposal 137)
cooldown_signature_keying_enabled = false  # [production: true — canary, proposal 137] Key both tend cooldowns to the signature they were stamped against — (branch head, origin/main base, CI rollup) for the conflict cooldown, (branch head, CI rollup) for the quality-fix one — so a provably-changed component releases the cooldown before the hours window is consulted (proposal 137); off keeps the pure wall-clock windows
owed_act_binding_enabled = false  # [production: true — canary, proposal 137] Bind the two remaining give-up decisions to the owed act the PR presents — audit rule 21 drops its 'or gh pr close #N' clause while the PR is code-owed, and assess_pr_salvage holds the disposal veto on code-owed work inside the reconcile budget (proposal 137); off keeps today's finding text and salvage verdict table
# Version archive — snapshots rolling metrics per merged evolution PR.
# The window controls how many recent tasks feed the rolling metrics.
# Disabling makes _snapshot_version() a no-op.
version_archive_enabled = true
version_archive_window_iterations = 10
self_review_max_rounds = 2    # LLM plan-aware self-review rounds after implement() (0 disables)
self_review_own_session_enabled = false  # [production: true — canary, proposal 140] each self-review round on its own high-effort session, not the implementer's
# Post-implementation quality-gate / auto-fix loop. After implement() + self_review,
# run_quality_gates() is checked; on failure the fix step routes through
# converge_to_green (see below), which grinds auto_fix() while the failing-gate set
# strictly shrinks and demotes the plan to 'failed' only on a no-progress stall. A
# 'failed' plan is retried by _implement_approved_plans up to
# max_implementation_attempts cross-iteration times before a terminal GitHub issue
# is opened. 'failed' is distinct from 'rejected' — it does NOT trigger
# rejection-learning or the 7-day cooldown.
auto_fix_max_rounds = 3          # Raises the convergence ceiling floor (max with gate_convergence_ceiling); >= 0 (proposal 110)
# Gate convergence (proposal 110). implement_plan's post-implementation fix loop
# routes unconditionally through EvolutionEngine.converge_to_green, which keeps
# grinding while the failing-gate set strictly shrinks (rather than stopping at a
# fixed round cap) and stops honestly when it stalls. gate_convergence_ceiling is
# the generous backstop that guarantees termination; auto_fix_max_rounds now only
# raises that ceiling's floor.
gate_convergence_ceiling = 20     # Backstop cap on convergence fix rounds (>= 1)
# Gate observation (proposal 124). When on, run_quality_gates parses each gate
# runner's retained output into a structured GateRunObservation (enumerated
# failures, TIMEOUT / UNAVAILABLE named instead of "could not run") and attaches it
# to the QualityGateResult, and a `pytest -x` probe that -x cut short (a failing
# test or a collection abort, not a coverage-only shortfall) is re-run once without
# -x so the whole failing set is enumerated. Off: byte-identical commands and
# raw_output, and observation is None. No consumer reads the observation yet.
gate_observation_enabled = false  # [production: true — canary, proposal 124] Attach a structured gate observation to QualityGateResult
# Conscious-access workspace observation (proposal 130). On: a zero-SDK `attend`
# phase between tend_evolution_prs and contemplate gathers candidates from
# already-materialised facts, assembles exactly one immutable ConsciousMoment, and
# appends one episode to conscious_episodes.jsonl (or the SQLite ledger). The moment
# is injected nowhere — no prompt, no decision, no gate consults it. Off in base
# (proposal 149): no moment was ever cited, so this zero-citation writer is stopped
# in one reversible base change (no prod-only canary, for the same reason it was
# turned on everywhere); true restores the burn-in. Off: attend never runs.
conscious_workspace_observe_enabled = false
# Conscious-access workspace broadcast (proposal 130). On: the selected moment is
# rendered to a bounded block and prepended, per call, to the contemplation and
# evolution priced-introspection prompts (via introspect's workspace_moment param),
# and each delivery records a BroadcastReceipt. Advisory only — prompt text, no
# capability, no plan approval, no gate. Off (default): introspect receives an empty
# block and every prompt is byte-identical. A no-op unless the observe flag is also
# on (no attend pass means no moment to broadcast).
conscious_workspace_broadcast_enabled = false
# Gate execution lease (proposal 126). On (default): `maestro gate-lease -- <cmd>`
# measures the host — the tighter of the host figure and the cgroup limit, so a run
# inside a memory-/cpu-limited container sizes to the container, not the host it
# shares (#3760) — counts in-flight gate runs, plans a bounded worker grant + slot
# budget, and holds a concurrency slot for the child's lifetime so concurrent
# full-suite runs cannot oversubscribe a small host. Off (the flag-off rollback):
# the wrapper takes no slot and runs the child at today's `auto` width. The shell
# runner, the three hand-run command docs, and the in-process loop gate readers
# (run_quality_gates, run_gate_check, preflight) route their gate sequence through
# the shared lease_for_gate_run seam.
gate_lease_enabled = true
# Apply the lease's host memory reserve (SYSTEM_RESERVE_MIB) only to a *host*-bounded
# headroom reading. That reserve holds back memory for the OS and the non-agent
# baseline, which live outside a loop cgroup — and a cgroup's `memory.max -
# memory.current` figure has already netted that baseline out, so subtracting it
# again floors the grant at one worker inside a small container. On: the reserve is
# omitted when the measured headroom was cgroup-bounded. Off (default): today's
# behaviour exactly. Every gate_runs.jsonl row records `available_mib` and
# `bounded_by` either way, so the flip is made against measured evidence.
gate_lease_cgroup_reserve_enabled = false
# Cap how many gate runs the lease admits at once. Without it the slot budget is
# the core count, so concurrent full suites on one host slow each other until the
# wall-clock per-test pytest-timeout budget kills them (the non-clean rate climbs
# with observed in_flight). On: at most max(1, cores // 4) runs are admitted and
# the rest queue up to 600s — long enough to outlast one suite — before failing
# open. It binds only out-of-process runs (`maestro gate-lease` / `gate-check`);
# the loop's own in-process and preflight runs keep today's budget and 30s wait,
# since a 600s queue there would block the event loop. In the 4-core loop
# container the cap still shrinks the wrapper budget to one slot, so a subagent's
# queued wrapper run can outlast its Bash tool timeout. Judge it by
# gate_runs.jsonl's in_flight / admission / wait_seconds and
# `maestro measure-gate-contention` (its p50 wait column).
gate_lease_admission_cap_enabled = true
# Proposal 134 gate fit: let the gate execution lease own the pytest run's *budget*
# as well as its width. On: the grant carries a `deadline_seconds` derived from the
# telemetry ledger at that same granted width — when the most recent in-process run
# at this width was killed at its own deadline the next one escalates by 1.5x,
# floored at `[timeouts] selfcheck` and capped at `[timeouts] selfcheck_max`, so a
# suite that genuinely needs more than the constant buys its way up to a fit instead
# of producing censored `tests:TIMEOUT` readings forever. Off (default): every gate
# runs under `selfcheck`, byte-identical to today.
gate_budget_lease_owned_enabled = false  # [production: true — canary, proposal 134]
# Proposal 134 gate fit: let the gate execution lease own *which suite* a
# post-implementation fix-loop round runs. On: `converge_to_green`'s inner rounds
# run only the test modules the changed files can reach (`maestro gate-scope`'s
# oracle) with `--no-cov`, so a round costs what the diff costs rather than what
# the suite costs; the pre-loop read stays full, and a green narrowed round is
# certified by one fresh full-scope, with-coverage read before the loop may return
# `green`. Off (default): every round runs the whole suite with coverage,
# byte-identical to today.
gate_scope_impacted_enabled = false
# Proposal 133: consult the gate-runnability oracle before an implementation attempt
# is spent. On: the approved-plan selector refreshes the verdict once per iteration
# and, when the local gate provably cannot reach a verdict (a missing first-party
# sibling, a suite pytest cannot collect, a suite that cannot finish in its budget),
# implements nothing that iteration — each plan it would have selected keeps its
# `approved` status and its `failure_count`, stamped with the verdict's fingerprint,
# so a broken environment stops burning the attempt budget on a red no diff can
# clear. Thomas is asked once per distinct fact. Off (default): no probe is issued
# and selection is byte-identical to today.
gate_environment_oracle_enabled = false  # [production: true — canary, proposal 133]
# Host-scoped slot-lock directory the wrapper probes. Shared across every checkout
# on a host so the lease bounds *cross-checkout* concurrency; `~` expands to $HOME.
# An operator or container can redirect it. Not `memory_dir/gate_slots`, which this
# repo's `memory_dir = "data"` would scope privately per checkout. The loop container
# mounts only `.:/workspace`, so this default `~/.maestro/gate_slots` is
# container-private: to share slots between loop-side and host interactive runs,
# bind-mount this directory or point the key at a path under `/workspace` (see
# docs/deployment.md).
gate_lease_slot_dir = "~/.maestro/gate_slots"
# Host-capacity sensor (proposal 125). On: contemplate (and the loop's hoisted
# iteration-start snapshot it reuses) reads live host load per core, memory and
# swap residency, and free disk on the Docker root, folds any saturated resource
# into the health summary, and drops the "host capacity unmeasured" blind spot.
# Off (default): no reading is taken and the health summary is byte-identical to
# today; blind_spots still names host capacity as an unmeasured gap. Calibrating
# the thresholds is a separate later flip.
host_capacity_sensor_enabled = false  # [production: true — canary, proposal 125]
# Runtime contract enforcement (proposal 141 step 8). preflight and every
# agent-building command (loop, serve, run, ...) fold
# deploy/runtime_contract.toml against the live environment (offline). On:
# a required violation fails preflight / startup, naming the entry. Off
# (default): each violation is logged at WARNING and startup continues.
runtime_contract_enforced = false
max_implementation_attempts = 3  # Max cross-iteration retries of a single failed plan (>= 1)
# Attempt-disposition oracle (proposal 131, RESUME arm). On: a stalled-but-
# strictly-progressing quality-gate convergence preserves its evolution branch,
# carries the prior attempt's failing-identity baseline into the next
# implementation prompt, and re-admits to continue instead of cold-restarting —
# bounded by max_resume_attempts so a plan that never converges still terminates.
# Off (default): the implementation path and prompts are byte-identical to today.
attempt_disposition_enabled = false  # [production: true — canary, proposal 131]
# Resume budget for the RESUME arm: max times a plan may preserve its branch and
# continue a progressing stall before the oracle degrades to the ordinary demote.
# Read only when attempt_disposition_enabled is on.
max_resume_attempts = 2  # Max branch-preserving resumes of a single progressing plan (>= 1)
# Grounded contemplation (proposal 132). On: the priced contemplation (slot-A)
# reflection session is built with the bounded read-only reflection_retrieval
# surface instead of tools=[], so a bet can pull the fact it hinges on. Off
# (default): the session stays tools=[] and byte-identical. Read by
# MaestroAgent._grounded_reflection_active (which degrades under
# budget_throttle_active) and _build_contemplation_session_options; enabled as a
# production canary in maestro.production.toml (declared in flag_lifecycle.py's
# PROD_ONLY_CANARIES), default-off everywhere else.
grounded_reflection_enabled = false  # [production: true — canary, proposal 132]
# Grounded planning (proposal 143). On: the single-use sessions of the callers in
# grounded_planning_callers carry the bounded read-only tree surface so the
# planner reads before it claims; requires [sdk] single_use_evolution_calls_enabled.
# Off (default): byte-identical. Enabled as a production canary in
# maestro.production.toml (declared in flag_lifecycle.py's PROD_ONLY_CANARIES),
# default-off everywhere else.
grounded_planning_enabled = false  # [production: true — canary, proposal 143]
# Which planner callers the flag grounds — a subset of propose_plan,
# propose_plan_chain, curate_pending_plans (validated even flag-off). The
# default is propose_plan alone (reflect was deleted, proposal 155 step 4); add
# propose_plan_chain (used under multi_pr_proposals_enabled) and
# curate_pending_plans each as its own canary once the cost tripwire holds.
grounded_planning_callers = ["propose_plan"]
# When on (and grounded planning active), the grounded planner's bounded tree
# surface gains a sixth pure tool, search_rejections, backed by the rejected-plan
# corpus evolution.py reads from memory — so the planner queries the specific
# ideas already refused (and their reasons) at mint time, not just the aggregate
# category counts read_reality_inventory surfaces. Prod canary (declared in
# flag_lifecycle.py's PROD_ONLY_CANARIES), default-off everywhere else.
grounded_planning_rejection_tool_enabled = false  # [production: true — canary]
# Stale-repeat bet guard. On: contemplate() bans reuse of any loss condition
# already staked at/above the repeat threshold without ever scoring 'correct' (the
# 'comfort bet' — an always-winnable/never-scoring wager re-run verbatim) by naming
# it in the priced-reflection prompt's do-not-reuse block, so the next bet cannot
# verbatim-repeat a stale loser (whitespace/case-normalised matching only, not a
# reworded restatement). Off (default): the banned set is empty and the prompt is
# byte-identical. Read by agent.contemplate.
stale_repeat_bet_guard_enabled = false
# Cap on plans implemented per iteration. _implement_approved_plans selects every
# eligible plan and processes only the first cap entries in sort order; the rest
# drain across subsequent iterations. Default 1 bounds blast radius when a queue
# accumulates from prior skipped iterations (budget throttle, crash-resume past
# the phase, standby) or batch dashboard / Telegram approvals — see CLAUDE.md
# "Self-evolution" / Implementation cap invariant.
max_implementations_per_iteration = 1  # Max plans implemented per iteration (>= 1)
# Experimental concurrency cap on open evolution PRs. When count >= cap,
# _implement_approved_plans returns early and steers toward integration.
# <= 0 disables the gate entirely.
max_open_evolution_prs = 5
executor_loop_detect_repeats = 3  # Abort step after N consecutive identical tool-call fingerprints (>= 2)
executor_empty_response_retries = 1  # Retry empty SDK responses this many times before failing the step (>= 0; 0 disables)
# Self-regulating burn-rate throttle — when the rolling-window spend rate
# reaches max_loop_budget_usd_per_hour, the inter-iteration sleep is
# stretched by a multiplier proportional to rate / limit (capped at
# budget_throttle_max_multiplier). All phases keep running; only the gap
# between iterations stretches. As samples age out of the rolling window,
# the rate falls, the multiplier falls, and the loop returns to base pace
# on its own — no human intervention needed. 0 = disabled.
max_loop_budget_usd_per_hour = 0.0       # Max burn rate in USD/hour (0 = disabled)
budget_rate_window_hours = 1.0           # Rolling window for rate computation
budget_rate_min_cost_usd = 0.10          # Suppress throttle until >= this much has been spent in the window
budget_throttle_max_multiplier = 60.0    # Cap on the proportional sleep multiplier (>= 1.0)

# Tiered-memory archive rotation — on dream cycles, splits
# task_history.jsonl and evolution_plans.jsonl into a hot file (records
# newer than archive_threshold_days) and a cold sibling
# (<file>.archive.jsonl). 0 disables rotation; both files grow unbounded.
# An enabled value must exceed every hot-read window over the rotated
# files — max(168h dashboard cost window, budget_rate_window_hours,
# plan_review_expiry_days) — or startup fails validation. With the defaults
# that floor is 21 days (plan_review_expiry_days), so 22 is the smallest
# enabled value.
archive_threshold_days = 0               # Days to keep in the hot file (0 = disabled, else > the floor)

# Startup cooldown when the prior run crashed with a rate-limit SDK
# error. Gives the upstream rate-limit window time to clear before the
# new process makes its first SDK call. 0 disables.
startup_rate_limit_cooldown_seconds = 60

# Standby window — pauses all SDK calls during the given UTC hours.
# start is inclusive, end is exclusive. Wraparound (start > end) is allowed
# for windows that cross midnight UTC.
standby_enabled = false        # Master switch
standby_start_hour_utc = 13    # 1:00 PM UTC
standby_end_hour_utc = 19      # 7:00 PM UTC

# Peak-hours scheduled budget throttle. Inside the window the burn-rate
# throttle's effective budget limit is multiplied by
# peak_throttle_rate_multiplier (< 1.0 tightens it), so the existing burn-rate
# sleep-multiplier fires sooner and the loop slows down. Heavy LLM phases are
# NOT gated off by the window itself — only a genuine burn-rate breach (against
# the untightened limit) still gates phases, exactly as off-peak. Because the
# slowdown rides on the burn-rate machinery, it has NO effect unless
# max_loop_budget_usd_per_hour > 0. Differs from standby (which skips the
# entire iteration body) by design: this is "save money during peak, keep
# working."
peak_throttle_enabled = false                 # Master switch
# Hours are wall-clock in peak_throttle_timezone (an IANA zone name);
# DST transitions are handled automatically. Default targets
# 5-11 AM Pacific Time on weekdays year-round.
peak_throttle_timezone = "America/Los_Angeles"
peak_throttle_start_hour = 5                  # 5 AM in peak_throttle_timezone
peak_throttle_end_hour = 11                   # 11 AM in peak_throttle_timezone
peak_throttle_weekdays_only = true            # Mon-Fri (in peak_throttle_timezone)
peak_throttle_rate_multiplier = 0.5           # Peak budget = limit * this (< 1.0 tightens)

# Long-context opt-in — when models.long_context is set AND this flag is
# true, the per-plan implementation session runs on the long-context
# model and bash output capture uses a larger cap so verbose build/test
# logs survive into the next step's prior_context. Disabled by default
# because it raises cost on every implementation step. The self_review
# and conflict-resolution call sites read models.long_context directly
# (no separate per-site flag) — they fire rarely enough that always-on
# long-context there is acceptable when models.long_context is set.
long_context_implementation_enabled = false

# Experiment cadence — after every N recorded tasks, the generation
# prompt mechanically requires a hypothesis-driven experiment where
# success means "data collected and analyzed" regardless of confirmation.
# The experiment lands on the task produced once the recorded count
# reaches a multiple of N. Existing short-circuit gates (audit-stall,
# cost-risk) take precedence. Cadence is measured against the hot
# task_history.jsonl count, so it resets after each tiered-memory archive
# — "after every N recorded tasks since the last archive," not absolute
# lifetime.
experiment_cadence = 5           # Inject experiment-mode prompt after every N recorded tasks (>= 1)

# Promotable-backlog pressure — when successful task branches not yet
# cited by any plan's source_task_id exceed this threshold, a PROMOTABLE
# BACKLOG section is injected into the task-generation prompt listing
# top-3 candidates. Experiment priority — revert or upgrade to gate if
# backlog does not decrease within 30 iterations.
promotable_backlog_threshold = 3  # Uncited successful branches needed to trigger prompt injection (count >= this; value >= 0)

# Promotable-backlog directive bridge — directive-bridge complement to the
# advisory backlog prompt hints. When the uncited-branch count reaches
# promotable_backlog_threshold and no directive is pending, auto-fills
# next_task_directive naming the oldest uncited branch so the signal
# actuates behavior. Self-extinguishing. Experimental — revert if the
# backlog does not decrease within 10 iterations.
promotable_backlog_directive_enabled = true  # Master switch

# Promotable-branch hint — surfaces successful unmerged task branches
# in the task-generation prompt so the LLM can propose branch-promotion
# tasks (integration over creation). Zero SDK cost context injection.
# Experiment — may be reverted if promotion rate is negligible.
promotable_branch_hint_enabled = true   # Master switch
promotable_branch_max_shown = 5         # Max branches shown in prompt (>= 1)

# Prior-task context injection — injects most recent task's findings
# (any outcome) into task-generation prompt for compounding.
prior_task_context_enabled = true       # Master switch

# Integration cadence — when no task in the last N tasks performed
