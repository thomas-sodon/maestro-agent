# Placement drop-in for the operator's interactive shell (interactive tier).
#
# Declarative artifact mirroring /etc/systemd/system/devshell.service.d/. Nothing
# in the repo consumes it at runtime; the operator installs it with `cp` +
# `systemctl daemon-reload` (see deploy/systemd/README.md). deploy/placement.toml
# is the source of truth for which units must carry a bound; this file provides
# the bound itself, and tests/test_workload_placement.py pins the invariants.
#
# Interactive tier: weighted strictly above the bursty-batch runners so a CI
# burst cannot starve the operator's own shell. CPUWeight is a relative share
# (default 100); a finite MemoryMax replaces the historical `infinity`. Numbers
# are operator-tunable starting values.
#
# MemoryHigh sits below MemoryMax so pressure reclaims-and-throttles first: under
# cgroup v2 MemoryMax is a hard wall that OOM-kills with no throttle stage, which
# on this host would kill the operator's own interactive session. The
# soft MemoryHigh gives that session a throttle band before the hard cap.
[Service]
CPUWeight=400
MemoryHigh=5G
MemoryMax=6G
