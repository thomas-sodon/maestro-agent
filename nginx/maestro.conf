# Maestro Dashboard — nginx reverse proxy with Cloudflare origin SSL
# Symlink into nginx: ln -sf /home/maestro/maestro/nginx/maestro.conf /etc/nginx/sites-enabled/

# WebSocket upgrade map: emit "upgrade" only when the client sent an
# Upgrade header (WebSocket handshake), "close" for ordinary HTTP/SSE so
# keep-alive negotiation with the upstream is not overridden. See #184.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name maestro.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name maestro.example.com;

    # Cloudflare origin certificate
    ssl_certificate     /etc/ssl/maestro/origin.pem;
    ssl_certificate_key /etc/ssl/maestro/origin-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cloudflare → real client IP. Cloudflare strips inbound CF-Connecting-IP
    # on every hop and sets it from the L4 source, so it is trustworthy iff
    # the TCP peer is a Cloudflare edge. set_real_ip_from whitelists each
    # published CF range; real_ip_header rewrites $remote_addr to the
    # CF-Connecting-IP value when the peer matches the whitelist, otherwise
    # leaves $remote_addr as the unspoofed peer address (so a direct-to-VPS
    # attacker bypassing Cloudflare still sees their own IP, not a forged one).
    #
    # Refresh on Cloudflare IP-range changes:
    #   curl -sf https://www.cloudflare.com/ips-v4
    #   curl -sf https://www.cloudflare.com/ips-v6
    # Last refreshed: 2026-05-28
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    location / {
        proxy_pass http://127.0.0.1:8420;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / SSE support. Connection is conditional (see map above):
        # "upgrade" only for WebSocket handshakes, "close" for plain HTTP/SSE.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Disable buffering for streaming responses (SSE, live logs)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400;
    }
}
